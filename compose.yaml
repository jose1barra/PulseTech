services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the full public HTTPS origin}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random owner setup code}
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL connection URL}
    ports:
      - "${BIND_IP:-127.0.0.1}:5173:5173"
    volumes:
      - app-data:/app/.private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  app-data:
